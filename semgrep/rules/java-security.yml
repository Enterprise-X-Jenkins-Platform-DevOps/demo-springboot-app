rules:
  - id: java-hardcoded-password
    languages:
      - java

    severity: ERROR

    message: >
      Hardcoded password detected.
      Secrets must not be stored directly in source code.

    patterns:
      - pattern: |
          private static final String $VAR = "$VALUE";

      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i).*(password|passwd|pwd|secret).*'